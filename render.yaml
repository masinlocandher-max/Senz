services:
  - type: web
    name: senz-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_ORIGIN
        value: https://senzpr.com,https://www.senzpr.com
      - key: CANONICAL_HOST
        value: www.senzpr.com
      - key: REDIRECT_HOSTS
        value: senzpr.com
      - key: SENZ_FORM_DELIVERY_ENDPOINT
        value: https://formsubmit.co/ajax/info.senz.pr@gmail.com
